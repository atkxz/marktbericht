<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marktbericht</title>
<meta name="description" content="Täglicher Marktbericht mit Kursen, Makrodaten und Nachrichten aus offiziellen Quellen.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d131c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marktbericht">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <h1 id="title">Heute</h1>
    <span id="status" class="status"></span>
  </div>
</header>

<div id="archive-banner" class="banner" hidden>
  <span id="archive-label"></span>
  <button type="button" id="archive-close" class="link">Zum aktuellen Bericht</button>
</div>

<main id="view" class="view">
  <div class="loading"><span></span><span></span><span></span></div>
</main>

<nav class="tabs" aria-label="Bereiche">
  <a href="#heute" data-tab="heute"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>Heute</a>
  <a href="#watchlist" data-tab="watchlist"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Watchlist</a>
  <a href="#maerkte" data-tab="maerkte"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg>Märkte</a>
  <a href="#news" data-tab="news"><svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>News</a>
  <a href="#archiv" data-tab="archiv"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="4" rx="1"/><path d="M5 9v9.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>Archiv</a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" id="sheet-close" class="close" aria-label="Schließen">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
